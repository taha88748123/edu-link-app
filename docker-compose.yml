# docker-compose.yml — NAJA7I-APP local dev
# Profiles : infra (deps) · platform (config/eureka/gateway) · services (microservices métier) ·
#            frontend (Vite web) · observability (Prometheus / Loki / Tempo / Grafana / Promtail)

name: naja7i

x-common-env: &common-env
  TZ: Africa/Casablanca
  # Default OTLP endpoint — points at Tempo when the `observability` profile
  # is up; if it isn't running the exporter retries silently and the app keeps
  # working. Override per-service if needed.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}

services:
  # ---------------------------------------------------------------- INFRA
  postgres:
    image: postgres:16-alpine
    profiles: [infra]
    environment:
      <<: *common-env
      POSTGRES_USER: naja7i
      POSTGRES_PASSWORD: naja7i_dev
      POSTGRES_DB: naja7i
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naja7i"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    profiles: [infra]
    environment:
      <<: *common-env
      MONGO_INITDB_ROOT_USERNAME: naja7i
      MONGO_INITDB_ROOT_PASSWORD: naja7i_dev
    ports: ["27017:27017"]
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: [infra]
    environment: { <<: *common-env }
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    profiles: [infra]
    environment:
      <<: *common-env
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports: ["2181:2181"]

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    profiles: [infra]
    depends_on: [zookeeper]
    environment:
      <<: *common-env
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: [infra]
    depends_on: [kafka]
    environment:
      <<: *common-env
      KAFKA_CLUSTERS_0_NAME: naja7i
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports: ["8090:8080"]

  minio:
    image: minio/minio:latest
    profiles: [infra]
    command: server /data --console-address ":9001"
    environment:
      <<: *common-env
      MINIO_ROOT_USER: naja7i
      MINIO_ROOT_PASSWORD: naja7i_dev_changeme
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    profiles: [infra]
    environment: { <<: *common-env }
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI

  # ---------------------------------------------------------------- PLATFORM
  config-server:
    build:
      context: ./backend
      dockerfile: ./config-server/Dockerfile
    profiles: [platform]
    image: naja7i/config-server:dev
    environment:
      <<: *common-env
      # `native` keeps Spring Cloud Config in classpath-mode (vs the default
      # git mode which would require a remote URI). `docker` swaps the human
      # logback pattern for the JSON encoder shipped by shared-observability.
      SPRING_PROFILES_ACTIVE: native,docker
    ports: ["8888:8888"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  service-discovery:
    build:
      context: ./backend
      dockerfile: ./service-discovery/Dockerfile
    profiles: [platform]
    image: naja7i/service-discovery:dev
    depends_on:
      config-server: { condition: service_healthy }
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: ./backend
      dockerfile: ./api-gateway/Dockerfile
    profiles: [platform]
    image: naja7i/api-gateway:dev
    depends_on:
      service-discovery: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      # Redis (used by the Bucket4j rate limiter introduced in Phase 5/C).
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      NAJA7I_JWT_SECRET: ${NAJA7I_JWT_SECRET:-dev-only-secret-change-me-32+chars-required}
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- SERVICES (Phase 1)
  auth-service:
    build:
      context: ./backend
      dockerfile: ./auth-service/Dockerfile
    profiles: [services]
    image: naja7i/auth-service:dev
    depends_on:
      service-discovery: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: naja7i
      SPRING_DATASOURCE_PASSWORD: naja7i_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP: kafka:29092
      NAJA7I_JWT_SECRET: ${NAJA7I_JWT_SECRET:-dev-only-secret-change-me-32+chars-required}
      # E2E test-mode backdoor. NEVER set this true in production — see
      # TestSupportController. Default false; CI overrides via env var.
      NAJA7I_AUTH_TEST_MODE: ${NAJA7I_AUTH_TEST_MODE:-false}
    ports: ["8101:8101"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  user-profile-service:
    build:
      context: ./backend
      dockerfile: ./user-profile-service/Dockerfile
    profiles: [services]
    image: naja7i/user-profile-service:dev
    depends_on:
      service-discovery: { condition: service_healthy }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/profile_db
      SPRING_DATASOURCE_USERNAME: naja7i
      SPRING_DATASOURCE_PASSWORD: naja7i_dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: naja7i
      MINIO_SECRET_KEY: naja7i_dev_changeme
      MINIO_BUCKET: naja7i-profiles
    ports: ["8102:8102"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  calendar-service:
    build:
      context: ./backend
      dockerfile: ./calendar-service/Dockerfile
    profiles: [services]
    image: naja7i/calendar-service:dev
    depends_on:
      service-discovery: { condition: service_healthy }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/calendar_db
      SPRING_DATASOURCE_USERNAME: naja7i
      SPRING_DATASOURCE_PASSWORD: naja7i_dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NAJA7I_INTERNAL_KEY: ${NAJA7I_INTERNAL_KEY:-dev-internal-key}
    ports: ["8103:8103"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8103/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  pricing-service:
    build:
      context: ./backend
      dockerfile: ./pricing-service/Dockerfile
    profiles: [services]
    image: naja7i/pricing-service:dev
    depends_on:
      service-discovery: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pricing_db
      SPRING_DATASOURCE_USERNAME: naja7i
      SPRING_DATASOURCE_PASSWORD: naja7i_dev
      NAJA7I_INTERNAL_KEY: ${NAJA7I_INTERNAL_KEY:-dev-internal-key}
    ports: ["8104:8104"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8104/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  booking-service:
    build:
      context: ./backend
      dockerfile: ./booking-service/Dockerfile
    profiles: [services]
    image: naja7i/booking-service:dev
    depends_on:
      service-discovery: { condition: service_healthy }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      calendar-service: { condition: service_healthy }
      pricing-service: { condition: service_healthy }
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_db
      SPRING_DATASOURCE_USERNAME: naja7i
      SPRING_DATASOURCE_PASSWORD: naja7i_dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NAJA7I_INTERNAL_KEY: ${NAJA7I_INTERNAL_KEY:-dev-internal-key}
    ports: ["8105:8105"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8105/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  payment-service:
    build:
      context: ./backend
      dockerfile: ./payment-service/Dockerfile
    profiles: [services]
    image: naja7i/payment-service:dev
    depends_on:
      service-discovery: { condition: service_healthy }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: naja7i
      SPRING_DATASOURCE_PASSWORD: naja7i_dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports: ["8106:8106"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8106/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  chat-service:
    build:
      context: ./backend
      dockerfile: ./chat-service/Dockerfile
    profiles: [services]
    image: naja7i/chat-service:dev
    depends_on:
      service-discovery: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_DATA_MONGODB_URI: mongodb://naja7i:naja7i_dev@mongo:27017/chat_db?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NAJA7I_INTERNAL_KEY: ${NAJA7I_INTERNAL_KEY:-dev-internal-key}
      NAJA7I_CHAT_MODERATION_DRIVER: logging
    ports: ["8107:8107"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8107/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  video-session-service:
    build:
      context: ./backend
      dockerfile: ./video-session-service/Dockerfile
    profiles: [services]
    image: naja7i/video-session-service:dev
    depends_on:
      service-discovery: { condition: service_healthy }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video_db
      SPRING_DATASOURCE_USERNAME: naja7i
      SPRING_DATASOURCE_PASSWORD: naja7i_dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports: ["8108:8108"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  ai-agent-service:
    build:
      context: ./backend
      dockerfile: ./ai-agent-service/Dockerfile
    profiles: [services]
    image: naja7i/ai-agent-service:dev
    depends_on:
      service-discovery: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ai_db
      SPRING_DATASOURCE_USERNAME: naja7i
      SPRING_DATASOURCE_PASSWORD: naja7i_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports: ["8109:8109"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8109/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  notification-service:
    build:
      context: ./backend
      dockerfile: ./notification-service/Dockerfile
    profiles: [services]
    image: naja7i/notification-service:dev
    depends_on:
      service-discovery: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      mailhog: { condition: service_started }
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: notification_db
      POSTGRES_USER: naja7i
      POSTGRES_PASSWORD: naja7i_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      NAJA7I_INTERNAL_KEY: ${NAJA7I_INTERNAL_KEY:-dev-internal-key}
      NOTIF_SMS_DRIVER: logging
      NOTIF_WA_DRIVER: logging
      NOTIF_EMAIL_DRIVER: smtp
      NOTIF_PUSH_DRIVER: logging
    ports: ["8111:8111"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8111/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ---------------------------------------------------------------- OBSERVABILITY (LGTM)
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    ports: ["9090:9090"]
    environment: { <<: *common-env }
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  loki:
    image: grafana/loki:3.2.0
    profiles: [observability]
    ports: ["3100:3100"]
    environment: { <<: *common-env }
    volumes:
      - ./infrastructure/observability/loki/loki-config.yml:/etc/loki/config.yml:ro
      - lokidata:/loki
    command: -config.file=/etc/loki/config.yml

  promtail:
    image: grafana/promtail:3.2.0
    profiles: [observability]
    environment: { <<: *common-env }
    volumes:
      - ./infrastructure/observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on: [loki]

  tempo:
    image: grafana/tempo:2.6.1
    profiles: [observability]
    ports:
      - "3200:3200"   # Tempo HTTP API
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment: { <<: *common-env }
    volumes:
      - ./infrastructure/observability/tempo/tempo-config.yml:/etc/tempo/config.yml:ro
      - tempodata:/var/tempo
    command: -config.file=/etc/tempo/config.yml

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    ports: ["3000:3000"]
    volumes:
      - ./infrastructure/observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus, loki, tempo]
    environment:
      <<: *common-env
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""

  # ---------------------------------------------------------------- FRONTEND (Phase 4)
  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    profiles: [frontend]
    image: naja7i/frontend-web:dev
    depends_on:
      api-gateway: { condition: service_healthy }
    environment:
      <<: *common-env
    ports: ["5173:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  mongodata:
  redisdata:
  miniodata:
  promdata:
  lokidata:
  tempodata:
  grafanadata:

networks:
  default:
    name: naja7i-net
