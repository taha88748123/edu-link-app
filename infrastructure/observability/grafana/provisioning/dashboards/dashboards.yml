# Dashboard provider — loads any *.json under /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: 'NAJA7I'
    orgId: 1
    folder: 'NAJA7I'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
