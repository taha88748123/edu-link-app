# Grafana configuration — DEV ONLY.
#
# Anonymous viewer access is enabled to make the UI immediately usable during
# local development. For prod, set:
#   - auth.anonymous.enabled = false
#   - security.admin_password to a strong secret (via env GF_SECURITY_ADMIN_PASSWORD)
#   - users.allow_sign_up = false (already the default)

[server]
http_port = 3000
domain = localhost

[security]
admin_user = admin
admin_password = admin
disable_initial_admin_creation = false

[users]
allow_sign_up = false

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = info
