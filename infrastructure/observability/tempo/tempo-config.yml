# Tempo single-binary configuration for the NAJA7I observability stack.
#
# - OTLP gRPC (:4317) and OTLP HTTP (:4318) receivers for traces from services.
# - Local filesystem storage under /var/tempo/.
# - 7-day retention.

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1_000_000
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h            # 7 days
    compacted_block_retention: 1h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    pool:
      max_workers: 10
      queue_depth: 1000

usage_report:
  reporting_enabled: false
