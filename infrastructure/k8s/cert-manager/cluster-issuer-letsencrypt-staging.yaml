# =============================================================================
# Let's Encrypt STAGING ClusterIssuer.
#
# Staging endpoint has very high rate limits but does NOT produce a
# browser-trusted certificate. Use this for testing the issuance pipeline
# (Ingress → cert-manager → ACME challenge) without burning the prod quota.
#
# Apply once per cluster:
#   kubectl apply -f cluster-issuer-letsencrypt-staging.yaml
# =============================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # CHANGE ME before applying.
    email: platform@naja7i.ma
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
        selector:
          dnsZones:
            - "staging.naja7i.ma"
            - "naja7i.localtest.me"
