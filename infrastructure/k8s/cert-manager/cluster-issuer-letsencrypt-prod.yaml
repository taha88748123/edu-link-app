# =============================================================================
# Let's Encrypt PRODUCTION ClusterIssuer.
#
# Real, browser-trusted certificates. Subject to LE rate limits
# (50 certs / domain / week, etc.) — always validate via the staging issuer
# first before flipping to prod.
#
# Apply once per cluster:
#   kubectl apply -f cluster-issuer-letsencrypt-prod.yaml
# =============================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # CHANGE ME before applying.
    email: platform@naja7i.ma
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
        selector:
          dnsZones:
            - "naja7i.ma"
