apiVersion: v2
name: naja7i
description: NAJA7I-APP umbrella chart — 13 microservices + frontend + ingress
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.27.0"
keywords:
  - naja7i
  - education
  - microservices
  - spring-boot
maintainers:
  - name: platform-team
    email: platform@naja7i.ma
annotations:
  naja7i.io/owner: platform-team
  naja7i.io/description: Umbrella chart bundling all NAJA7I services + Bitnami infra subcharts

dependencies:
  - name: postgresql
    alias: postgres
    version: 16.0.x
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgres.enabled
  - name: mongodb
    version: 16.x.x
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: mongodb.enabled
  - name: redis
    version: 20.x.x
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
  - name: kafka
    version: 30.x.x
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: kafka.enabled
  - name: minio
    version: 14.x.x
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: minio.enabled
