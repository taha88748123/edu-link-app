{{- $issuer := index .Values.ingress.annotations "cert-manager.io/cluster-issuer" -}}
{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled $issuer }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ingress.tls.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naja7i.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.ingress.tls.secretName }}
  duration: 2160h            # 90d (LE max)
  renewBefore: 360h          # 15d
  issuerRef:
    name: {{ $issuer }}
    kind: ClusterIssuer
    group: cert-manager.io
  commonName: {{ .Values.global.domain | quote }}
  dnsNames:
    - {{ .Values.global.domain | quote }}
    - {{ .Values.global.apiDomain | quote }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
{{- end }}
