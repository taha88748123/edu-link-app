{{- if .Values.placeholderSecret.enabled }}
# -----------------------------------------------------------------------------
# DEV-ONLY placeholder Secret. Do NOT enable in staging or production —
# in those environments the cluster must already have a `naja7i-secrets`
# Secret produced via sealed-secrets (kubeseal). See
# infrastructure/k8s/sealed-secrets/README.md for the recipe.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.placeholderSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naja7i.labels" . | nindent 4 }}
    naja7i.io/secret-source: placeholder
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
{{- range $k, $v := .Values.placeholderSecret.data }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
