# =============================================================================
# sample-naja7i-secrets.yaml
#
# !!! WARNING !!!
#   This is a PLAINTEXT template with DUMMY values. Do NOT commit a real,
#   populated version of this file to git. Instead:
#     1. Fill in real values locally (or generate them with `openssl rand`)
#     2. Pipe through `kubeseal --cert pub.pem -o yaml` → sealed-naja7i-secrets.yaml
#     3. Commit ONLY the sealed manifest.
#
# See README.md in this directory for the full recipe.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: naja7i-secrets
  namespace: naja7i
type: Opaque
stringData:
  # JWT — used by api-gateway + auth-service. Must be ≥32 chars.
  jwt-secret: "changeme-please-at-least-32-chars-long"
  # Shared internal header for service-to-service calls.
  internal-key: "changeme-please"
  # Postgres credentials (single user, multiple DBs).
  postgres-password: "changeme-please"
  # Mongo root user password.
  mongodb-password: "changeme-please"
  # Redis password (leave empty if auth disabled).
  redis-password: ""
  # MinIO / S3 secret key.
  minio-password: "changeme-please"
  # 3rd party APIs
  anthropic-api-key: "sk-ant-changeme"
  twilio-auth-token: "changeme-please"
  sendgrid-api-key: "SG.changeme.please"
  livekit-api-secret: "changeme-please"
  # Firebase service account JSON — paste full JSON contents on one line.
  firebase-service-account-json: "{}"
