server:
  port: 8105
  forward-headers-strategy: framework

spring:
  application:
    name: booking-service
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booking_db}
    username: ${SPRING_DATASOURCE_USERNAME:naja7i}
    password: ${SPRING_DATASOURCE_PASSWORD:naja7i}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: booking-service
      auto-offset-reset: earliest

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3,w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method

naja7i:
  booking:
    internal-key: ${NAJA7I_INTERNAL_KEY:dev-internal-key}
    dispute-window-hours: 24
    lead-tolerance-minutes: 15
    outbox-poll-ms: 2000
    outbox-batch-size: 50
    rest-connect-timeout-ms: 3000
    rest-read-timeout-ms: 5000
    # Service discovery: by default both URLs use Eureka logical service names.
    # Override these for local non-Eureka testing.
    calendar-base-url: ${NAJA7I_CALENDAR_BASE_URL:http://calendar-service}
    pricing-base-url: ${NAJA7I_PRICING_BASE_URL:http://pricing-service}
  kafka:
    topics:
      video-session-ended:  naja7i.video.session.ended.v1
      auth-user-suspended:  naja7i.auth.user.suspended.v1

logging:
  level:
    root: INFO
    ma.naja7i: INFO
    org.hibernate.SQL: WARN
    org.springframework.kafka: WARN
  pattern:
    # NB: PII (email, phone) must NEVER be logged in plain text.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
