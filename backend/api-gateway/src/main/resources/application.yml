spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false  # we declare routes explicitly in GatewayConfig
          lower-case-service-id: true
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  level:
    org.springframework.cloud.gateway: INFO
    ma.naja7i.gateway: DEBUG

# Note : naja7i.jwt and naja7i.cors come from config-server (api-gateway.yml).
# Defaults baked in for standalone test runs:
naja7i:
  jwt:
    secret: ${NAJA7I_JWT_SECRET:dev-only-secret-change-me-32+chars-required}
    issuer: naja7i-auth
    access-ttl: PT15M
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
