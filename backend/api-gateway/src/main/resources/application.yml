spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false  # we declare routes explicitly in GatewayConfig
          lower-case-service-id: true
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3,w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    ma.naja7i.gateway: DEBUG

# Note : naja7i.jwt and naja7i.cors come from config-server (api-gateway.yml).
# Defaults baked in for standalone test runs:
naja7i:
  jwt:
    secret: ${NAJA7I_JWT_SECRET:dev-only-secret-change-me-32+chars-required}
    issuer: naja7i-auth
    access-ttl: PT15M
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000

  # ------------------------------------------------------------------
  # Rate limiting (Bucket4j + Redis). See RateLimitProperties.
  # Tiers are per-minute token buckets. Anon/login/register are keyed by
  # client IP; auth/admin tiers are keyed by JWT userId. Actuator endpoints
  # are NEVER throttled (Prometheus scrapes them continuously).
  # ------------------------------------------------------------------
  gateway:
    rate-limit:
      enabled: ${NAJA7I_GATEWAY_RATE_LIMIT_ENABLED:true}
      anon:
        capacity: 30
        refill-tokens: 60
        refill-period: PT1M
      authenticated:
        capacity: 150
        refill-tokens: 300
        refill-period: PT1M
      admin:
        capacity: 300
        refill-tokens: 600
        refill-period: PT1M
      login:
        capacity: 5
        refill-tokens: 5
        refill-period: PT1M
      register:
        capacity: 3
        refill-tokens: 3
        refill-period: PT1M
