server:
  port: 8106
  forward-headers-strategy: framework

spring:
  application:
    name: payment-service
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${SPRING_DATASOURCE_USERNAME:naja7i}
    password: ${SPRING_DATASOURCE_PASSWORD:naja7i}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3,w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method

naja7i:
  payment:
    outbox-poll-ms: 2000
    outbox-batch-size: 50
    dispute-window-hours: 24
    # Default platform fee in basis points applied when a booking.requested event
    # arrives WITHOUT pre-computed platformFeeMinor. Kept here for safety; the
    # actual fee is normally provided by pricing-service via booking-service.
    platform-fee-bps: 1000
  kafka:
    topics:
      booking-requested:        naja7i.booking.requested.v1
      booking-confirmed:        naja7i.booking.confirmed.v1
      booking-cancelled:        naja7i.booking.cancelled.v1
      booking-declined:         naja7i.booking.declined.v1
      booking-dispute-resolved: naja7i.booking.dispute_resolved.v1

logging:
  level:
    root: INFO
    ma.naja7i: INFO
    org.hibernate.SQL: WARN
    org.springframework.kafka: WARN
  pattern:
    # PII (email/phone) is never present in payment-service, but we still avoid
    # logging raw user UUIDs or amounts at WARN/ERROR — correlate by traceId.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
