server:
  port: 8111

spring:
  application:
    name: notification-service
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:notification_db}
    username: ${POSTGRES_USER:naja7i}
    password: ${POSTGRES_PASSWORD:naja7i}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    ma.naja7i.notification: DEBUG
    org.springframework.kafka: INFO

# ------------------------------------------------------------------
# Notification-service tunables. All providers default to "logging"
# so the service starts on first boot WITHOUT any external credentials.
# ------------------------------------------------------------------
naja7i:
  notification:
    internal-key: ${NAJA7I_INTERNAL_KEY:dev-internal-key}
    producer: notification-service
    providers:
      sms:
        driver: ${NOTIF_SMS_DRIVER:logging}
        account-sid: ${TWILIO_ACCOUNT_SID:}
        auth-token:  ${TWILIO_AUTH_TOKEN:}
        from-number: ${TWILIO_FROM_NUMBER:}
      wa:
        driver: ${NOTIF_WA_DRIVER:logging}
        account-sid: ${TWILIO_ACCOUNT_SID:}
        auth-token:  ${TWILIO_AUTH_TOKEN:}
        from-number: ${TWILIO_WA_FROM_NUMBER:}
      email:
        driver: ${NOTIF_EMAIL_DRIVER:logging}     # logging | smtp | real
        from-email: ${NOTIF_EMAIL_FROM:noreply@naja7i.local}
        api-key:    ${SENDGRID_API_KEY:}
      push:
        driver: ${NOTIF_PUSH_DRIVER:logging}
        api-key: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
    retry:
      max-attempts: 5
      backoff-seconds: 30, 120, 600, 3600, 21600
      poll-interval-ms: 10000
    admin-alerts:
      inbox-key: admin@naja7i
      locale: fr
      channel: EMAIL
