server:
  port: 8102
  servlet:
    context-path: /
  forward-headers-strategy: framework

spring:
  application:
    name: user-profile-service
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/profile_db}
    username: ${SPRING_DATASOURCE_USERNAME:profile_user}
    password: ${SPRING_DATASOURCE_PASSWORD:profile_pwd}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: user-profile-service
      auto-offset-reset: earliest

  servlet:
    multipart:
      enabled: true
      max-file-size: 110MB
      max-request-size: 110MB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

naja7i:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:naja7i-profiles}
    presign-ttl-seconds: 900
    max-photo-bytes: 10485760
    max-diploma-bytes: 26214400
    max-video-bytes: 104857600
  kafka:
    topics:
      auth-user-registered: naja7i.auth.user.registered.v1

logging:
  level:
    ma.naja7i.profile: INFO
