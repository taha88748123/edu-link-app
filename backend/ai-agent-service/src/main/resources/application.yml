server:
  port: 8109
  forward-headers-strategy: framework

spring:
  application:
    name: ai-agent-service
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_db}
    username: ${SPRING_DATASOURCE_USERNAME:naja7i}
    password: ${SPRING_DATASOURCE_PASSWORD:naja7i}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ai-agent-service
      auto-offset-reset: earliest

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3,w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method

naja7i:
  ai:
    # Stable producer name embedded in outbound DomainEvent.producer.
    producer: ai-agent-service
    # Outbox poller cadence in milliseconds.
    outbox-poll-ms: 2000
    outbox-batch-size: 50
    matching:
      # `logging` (default deterministic baseline) or `anthropic`.
      driver: ${NAJA7I_AI_MATCHING_DRIVER:logging}
      # Redis TTL applied to cached suggestion lists (minutes).
      cache-ttl-minutes: 60
      max-results: 20
    anthropic:
      # Empty by default — the logging driver works without credentials.
      api-key: ${ANTHROPIC_API_KEY:}
      model: claude-opus-4-7
      max-tokens: 1024
      timeout-ms: 8000
      base-url: https://api.anthropic.com
  kafka:
    topics:
      prof-submitted:  naja7i.profile.prof.submitted.v1
      prof-validated:  naja7i.profile.prof.validated.v1
      review-created:  naja7i.profile.review.created.v1
      ai-call-completed: naja7i.ai.call.completed.v1

logging:
  level:
    root: INFO
    ma.naja7i: INFO
    org.hibernate.SQL: WARN
    org.springframework.kafka: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
