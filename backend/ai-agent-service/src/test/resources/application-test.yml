spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  config:
    import: "optional:configserver:"
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ai-agent-service-test
      auto-offset-reset: earliest
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

naja7i:
  ai:
    producer: ai-agent-service
    # Disabled in hermetic tests — the long delay ensures the @Scheduled
    # method never fires during the brief test window.
    outbox-poll-ms: 600000
    outbox-batch-size: 50
    matching:
      driver: logging
      cache-ttl-minutes: 60
      max-results: 20
    anthropic:
      api-key: ""
      model: claude-opus-4-7
      max-tokens: 1024
      timeout-ms: 8000
      base-url: https://api.anthropic.com
  kafka:
    topics:
      prof-submitted:  naja7i.profile.prof.submitted.v1
      prof-validated:  naja7i.profile.prof.validated.v1
      review-created:  naja7i.profile.review.created.v1
      ai-call-completed: naja7i.ai.call.completed.v1

logging:
  level:
    ma.naja7i: INFO
