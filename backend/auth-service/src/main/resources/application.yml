server:
  port: 8101
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:naja7i}
    password: ${SPRING_DATASOURCE_PASSWORD:naja7i}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  # ------------------------------------------------------------------
  # Distributed tracing — sampling 100% in dev. Reduce probability in prod.
  # OTLP endpoint defaults to localhost; docker-compose sets it to Tempo.
  # ------------------------------------------------------------------
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3,w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method

naja7i:
  jwt:
    secret: ${NAJA7I_JWT_SECRET:dev-only-secret-change-me-32+chars-required}
    issuer: naja7i-auth
    access-ttl: PT15M
    refresh-ttl: P14D
  otp:
    ttl: PT5M
    max-attempts: 5
    rate-limit-window-minutes: 15
    rate-limit-max-requests: 3
    code-length: 6

logging:
  level:
    root: INFO
    ma.naja7i: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.kafka: WARN
  pattern:
    # NB: PII (email, phone) must NEVER be logged in plain text.
    # The application code already avoids logging those values; this pattern stays human-readable.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
