spring:
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    discovery:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

naja7i:
  pricing:
    default-platform-fee-pct: 10
    internal-key: test-internal-key
