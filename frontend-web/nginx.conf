# NAJA7I — SPA + reverse proxy to the Spring Cloud Gateway.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip ------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security headers -----------------------------------------------
    # HSTS is enabled only when terminated by an HTTPS-aware proxy in production.
    # The 6-month max-age is conservative; bump to a year once we are confident.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Strict CSP.
    # - script-src 'self'    : no inline scripts (Vite emits hashed external bundles only).
    # - style-src 'self' 'unsafe-inline' : Tailwind ships compiled CSS, but Radix UI and
    #     shadcn inject a handful of measurement styles at runtime via <style> tags;
    #     dropping 'unsafe-inline' breaks Radix Popover/Tooltip portals. Keep it for now.
    # - connect-src           : same-origin + LiveKit cloud websockets (video sessions).
    #     Direct gateway hostnames are NOT listed because all REST goes through the
    #     same-origin nginx proxy (/api/...).
    # - frame-ancestors 'none': blocks clickjacking (defense-in-depth alongside X-Frame-Options).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.livekit.cloud wss://*.livekit.cloud; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Long-lived cache for hashed Vite assets.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # API proxy: forward /api/* to the gateway service (inside the same docker network).
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    # WebSocket proxy: forward /ws/* to the gateway with HTTP/1.1 Upgrade. The
    # api-gateway then routes (via Eureka) to the chat-service WS handler.
    location /ws/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Long-lived connection (chat sockets). Adjust per ops policy.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback ---------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching of the entry HTML so client gets new asset hashes on each deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
