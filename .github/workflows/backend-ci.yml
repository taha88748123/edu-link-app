name: backend-ci

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Verify Maven version
        run: mvn --version

      - name: Build shared-libs (install to local repo)
        working-directory: backend
        run: mvn -pl shared-libs -am -B clean install -DskipTests

      - name: Build & test platform services
        working-directory: backend
        run: mvn -B -pl config-server,service-discovery,api-gateway -am clean verify

      - name: Build & test Phase 1 microservices
        working-directory: backend
        run: mvn -B -pl auth-service,user-profile-service,notification-service -am clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push'
    strategy:
      matrix:
        service: [config-server, service-discovery, api-gateway, auth-service, user-profile-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/${{ matrix.service }}/Dockerfile
          push: false
          tags: naja7i/${{ matrix.service }}:${{ github.sha }}
